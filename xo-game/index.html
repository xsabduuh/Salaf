<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0d2827" />
  <link rel="icon" href="data:," />
  <title>لعبة XO</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap');
    :root{
      color-scheme:light dark;
      --bg:#eef4ef; --panel:#ffffff; --ink:#102b2a; --muted:#59706e;
      --line:#cddbd6; --soft:#e5eeea; --x:#e4573d; --o:#087d72;
      --accent:#0b6f66; --accent-2:#07534d; --gold:#d99b24;
      --shadow:0 14px 40px rgba(11,55,51,.12);
      --cell:#f6f9f7; --cell-hover:#edf5f1; --win:#fff0bf;
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#081b1a; --panel:#102b29; --ink:#effaf5; --muted:#adc4be;
        --line:#31504c; --soft:#183633; --x:#ff765f; --o:#55d0bd;
        --accent:#42b9a8; --accent-2:#79ddcf; --gold:#ffc85b;
        --shadow:0 18px 48px rgba(0,0,0,.28);
        --cell:#153431; --cell-hover:#1c403c; --win:#54491d;
      }
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:
      radial-gradient(circle at 100% 0, color-mix(in srgb,var(--o) 12%,transparent), transparent 28rem),
      var(--bg);color:var(--ink);font-family:"Noto Kufi Arabic",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
    button,select{font:inherit;color:inherit}
    button{cursor:pointer}
    .app{width:min(1180px,100%);margin:auto;padding:clamp(14px,3vw,34px)}
    .layout{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:clamp(18px,3vw,38px);align-items:start}
    .side{display:grid;gap:14px;position:sticky;top:20px}
    .card{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:18px}
    .mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:var(--soft);border-radius:16px}
    .mode-switch button{border:0;background:transparent;border-radius:12px;padding:10px 8px;font-weight:700;color:var(--muted)}
    .mode-switch button.active{background:var(--panel);color:var(--ink);box-shadow:0 3px 12px rgba(10,45,42,.12)}
    .section-title{font-size:.76rem;color:var(--muted);font-weight:700;margin:18px 0 8px}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .choice{border:1px solid var(--line);background:transparent;border-radius:13px;padding:9px 4px;font-size:.78rem;font-weight:700}
    .choice.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .choice small{display:block;font-size:.59rem;font-weight:600;opacity:.75;margin-top:2px}
    .score-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .score-title strong{font-size:.92rem}
    .icon-btn{border:0;background:var(--soft);width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
    .icon-btn svg{width:17px;height:17px}
    .score-grid{display:grid;grid-template-columns:1fr .72fr 1fr;gap:8px;align-items:stretch}
    .score{padding:12px 7px;background:var(--soft);border-radius:15px;text-align:center}
    .score b{display:block;font-size:1.55rem;line-height:1.2;font-variant-numeric:tabular-nums}
    .score span{font-size:.69rem;color:var(--muted)}
    .score.x b{color:var(--x)} .score.o b{color:var(--o)}
    .tip{font-size:.72rem;color:var(--muted);line-height:1.75;margin:0;padding:0 4px}
    .game{min-width:0;display:flex;flex-direction:column;align-items:center}
    .game-head{width:min(610px,100%);display:flex;align-items:center;justify-content:space-between;gap:14px;margin:4px 0 17px}
    .status-wrap{min-width:0}
    .status{font-size:clamp(1.12rem,3vw,1.5rem);font-weight:800;margin:0 0 3px}
    .substatus{font-size:.76rem;color:var(--muted);margin:0}
    .turn-chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:0 5px 16px rgba(11,55,51,.08);font-size:.76rem;color:var(--muted)}
    .turn-symbol{font-size:1.25rem;font-weight:800;color:var(--x);line-height:1}
    .board-shell{width:min(610px,100%);background:var(--panel);padding:clamp(10px,2.5vw,18px);border:1px solid var(--line);border-radius:clamp(20px,4vw,32px);box-shadow:var(--shadow)}
    .board{display:grid;gap:clamp(6px,1.3vw,10px);aspect-ratio:1}
    .cell{position:relative;border:0;background:var(--cell);border-radius:clamp(10px,2.4vw,18px);display:grid;place-items:center;padding:0;transition:background .18s,transform .1s;overflow:hidden}
    .cell:not(:disabled):hover{background:var(--cell-hover)}
    .cell:not(:disabled):active{transform:scale(.96)}
    .cell:disabled{cursor:default}
    .cell.win{background:var(--win)}
    .mark{display:block;width:62%;height:62%;position:relative;animation:pop .24s cubic-bezier(.2,1.6,.5,1)}
    .mark.x::before,.mark.x::after{content:"";position:absolute;left:46%;top:4%;width:13%;height:92%;background:var(--x);border-radius:999px;transform:rotate(45deg)}
    .mark.x::after{transform:rotate(-45deg)}
    .mark.o{border:clamp(5px,1.2vw,11px) solid var(--o);border-radius:50%}
    @keyframes pop{from{transform:scale(.35) rotate(-8deg);opacity:.2}to{transform:scale(1);opacity:1}}
    .actions{width:min(610px,100%);display:flex;justify-content:center;gap:10px;margin-top:15px}
    .primary,.secondary{border-radius:14px;padding:11px 17px;font-weight:700;border:1px solid var(--line)}
    .primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:142px}
    .secondary{background:var(--panel)}
    .secondary:disabled{opacity:.42;cursor:not-allowed}
    .toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,18px);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:13px;font-size:.75rem;opacity:0;pointer-events:none;transition:.22s;z-index:5;white-space:nowrap}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
    @media(max-width:760px){
      .app{padding:12px 12px 28px}.layout{grid-template-columns:1fr;gap:18px}.side{position:static;order:2}.game{order:1}
      .controls.card{padding:12px}.score-card{padding:14px}.section-title{margin-top:13px}.game-head{margin-top:2px}
      .tip{display:none}.board-shell{padding:10px;border-radius:22px}.board{gap:7px}.cell{border-radius:12px}
    }
    @media(max-width:390px){.turn-chip span:first-child{display:none}.game-head{gap:8px}.status{font-size:1.02rem}.substatus{font-size:.68rem}.choice{font-size:.7rem}.actions{gap:7px}.primary,.secondary{padding:10px 12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<main class="app">
  <div class="layout">
    <aside class="side">
      <section class="card controls" aria-label="إعدادات اللعب">
        <div class="mode-switch" role="group" aria-label="نمط اللعب">
          <button id="friendMode" class="active" type="button">مع صديق</button>
          <button id="botMode" type="button">ضد البوت</button>
        </div>
        <div id="difficultyWrap" hidden>
          <div class="section-title">ذكاء البوت</div>
          <div class="choices" id="difficultyChoices">
            <button class="choice active" data-difficulty="easy" type="button">ضعيف<small>مرح وتلقائي</small></button>
            <button class="choice" data-difficulty="medium" type="button">ذكي<small>يخطط ويدافع</small></button>
            <button class="choice" data-difficulty="hard" type="button">ذكي جداً<small>تحدٍ حقيقي</small></button>
          </div>
        </div>
        <div class="section-title">حجم الملعب</div>
        <div class="choices" id="sizeChoices">
          <button class="choice active" data-size="3" type="button">3 × 3<small>3 للفوز</small></button>
          <button class="choice" data-size="4" type="button">4 × 4<small>4 للفوز</small></button>
          <button class="choice" data-size="5" type="button">5 × 5<small>4 للفوز</small></button>
        </div>
      </section>
      <section class="card score-card" aria-label="لوحة النتيجة">
        <div class="score-title">
          <strong>نتيجة هذه الجلسة</strong>
          <button class="icon-btn" id="resetScore" type="button" aria-label="تصفير النتيجة" title="تصفير النتيجة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
        <div class="score-grid">
          <div class="score x"><b id="xScore">0</b><span id="xLabel">اللاعب X</span></div>
          <div class="score"><b id="drawScore">0</b><span>تعادل</span></div>
          <div class="score o"><b id="oScore">0</b><span id="oLabel">اللاعب O</span></div>
        </div>
      </section>
      <p class="tip">بدّل النمط أو حجم الملعب في أي وقت. النتيجة تُجمع طوال الجلسة الحالية ويمكنك تصفيرها من زر الإعادة.</p>
    </aside>

    <section class="game" aria-label="ملعب إكس أو">
      <div class="game-head">
        <div class="status-wrap" aria-live="polite">
          <h1 class="status" id="status">دور اللاعب X</h1>
          <p class="substatus" id="substatus">اختر مربعاً لبدء الجولة</p>
        </div>
        <div class="turn-chip"><span>الآن</span><b class="turn-symbol" id="turnSymbol">X</b></div>
      </div>
      <div class="board-shell">
        <div class="board" id="board" role="grid" aria-label="جدول لعبة XO"></div>
      </div>
      <div class="actions">
        <button class="primary" id="newRound" type="button">جولة جديدة</button>
        <button class="secondary" id="undo" type="button" disabled>تراجع</button>
      </div>
    </section>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  'use strict';
  var state={size:3, win:3, board:[], turn:'X', over:false, mode:'friend', difficulty:'easy', history:[], scores:{X:0,O:0,D:0}, thinking:false};
  var boardEl=document.getElementById('board'), statusEl=document.getElementById('status'), subEl=document.getElementById('substatus'), turnEl=document.getElementById('turnSymbol');
  var undoBtn=document.getElementById('undo'), toast=document.getElementById('toast');
  var scoreEls={X:document.getElementById('xScore'),O:document.getElementById('oScore'),D:document.getElementById('drawScore')};
  var botTimer=null;

  function initRound(){
    clearTimeout(botTimer); state.board=Array(state.size*state.size).fill(''); state.turn='X'; state.over=false; state.history=[]; state.thinking=false;
    renderBoard(); updateStatus(); updateUndo();
  }
  function renderBoard(){
    boardEl.innerHTML=''; boardEl.style.gridTemplateColumns='repeat('+state.size+',1fr)';
    state.board.forEach(function(v,i){
      var b=document.createElement('button'); b.type='button'; b.className='cell'; b.setAttribute('role','gridcell');
      b.setAttribute('aria-label',v?'المربع '+(i+1)+': '+v:'المربع '+(i+1)+' فارغ'); b.disabled=!!v||state.over||state.thinking;
      if(v){var m=document.createElement('span');m.className='mark '+v.toLowerCase();m.setAttribute('aria-hidden','true');b.appendChild(m)}
      b.addEventListener('click',function(){play(i)}); boardEl.appendChild(b);
    });
  }
  function play(i){
    if(state.over||state.thinking||state.board[i])return;
    place(i,state.turn);
    if(!state.over&&state.mode==='bot'&&state.turn==='O') botMove();
  }
  function place(i,mark){
    state.history.push({index:i,mark:mark}); state.board[i]=mark;
    var result=evaluate(state.board,state.size,state.win);
    if(result){finish(result)} else {state.turn=mark==='X'?'O':'X';renderBoard();updateStatus();updateUndo()}
  }
  function evaluate(board,n,k){
    var dirs=[[0,1],[1,0],[1,1],[1,-1]];
    for(var r=0;r<n;r++)for(var c=0;c<n;c++){
      var mark=board[r*n+c]; if(!mark)continue;
      for(var d=0;d<dirs.length;d++){
        var cells=[],ok=true;
        for(var j=0;j<k;j++){var rr=r+dirs[d][0]*j,cc=c+dirs[d][1]*j;if(rr<0||rr>=n||cc<0||cc>=n||board[rr*n+cc]!==mark){ok=false;break}cells.push(rr*n+cc)}
        if(ok)return{winner:mark,cells:cells};
      }
    }
    if(board.every(Boolean))return{winner:'D',cells:[]};
    return null;
  }
  function finish(result){
    state.over=true;state.thinking=false;state.scores[result.winner]++;updateScores();renderBoard();
    result.cells.forEach(function(i){boardEl.children[i].classList.add('win')});
    if(result.winner==='D'){statusEl.textContent='تعادل جميل!';subEl.textContent='الملعب امتلأ بلا فائز';turnEl.textContent='—';turnEl.style.color='var(--gold)'}
    else{var name=result.winner==='X'?'اللاعب X':(state.mode==='bot'?'البوت':'اللاعب O');statusEl.textContent='فاز '+name+'!';subEl.textContent='سلسلة رائعة — جاهز لجولة أخرى؟';turnEl.textContent=result.winner;turnEl.style.color=result.winner==='X'?'var(--x)':'var(--o)';burst(result.winner)}
    updateUndo();
  }
  function updateStatus(){
    var isBot=state.mode==='bot'&&state.turn==='O';
    statusEl.textContent=isBot?'البوت يفكر…':'دور '+(state.turn==='X'?'اللاعب X':(state.mode==='bot'?'البوت':'اللاعب O'));
    subEl.textContent=state.history.length?'راقب الصفوف والأعمدة والقطر':'اختر مربعاً لبدء الجولة';
    turnEl.textContent=state.turn;turnEl.style.color=state.turn==='X'?'var(--x)':'var(--o)';
  }
  function updateScores(){scoreEls.X.textContent=state.scores.X;scoreEls.O.textContent=state.scores.O;scoreEls.D.textContent=state.scores.D}
  function updateUndo(){undoBtn.disabled=!state.history.length||state.thinking}
  function botMove(){
    state.thinking=true;renderBoard();updateStatus();updateUndo();
    botTimer=setTimeout(function(){
      var move=chooseBotMove();state.thinking=false;if(move!==null)place(move,'O');
    },420);
  }
  function empties(board){var a=[];board.forEach(function(v,i){if(!v)a.push(i)});return a}
  function random(arr){return arr[Math.floor(Math.random()*arr.length)]}
  function chooseBotMove(){
    var free=empties(state.board);if(!free.length)return null;
    if(state.difficulty==='easy'){
      if(Math.random()<.68)return random(free);
      return tacticalMove('O')||random(free);
    }
    if(state.size===3&&state.difficulty==='hard')return minimaxBest();
    var winMove=tacticalMove('O');if(winMove!==null)return winMove;
    var block=tacticalMove('X');if(block!==null)return block;
    if(state.difficulty==='medium'){
      if(Math.random()<.35)return random(free);
      return positionalMove(free,false);
    }
    return positionalMove(free,true);
  }
  function tacticalMove(mark){
    var free=empties(state.board);
    for(var i=0;i<free.length;i++){var p=free[i];state.board[p]=mark;var res=evaluate(state.board,state.size,state.win);state.board[p]='';if(res&&res.winner===mark)return p}
    return null;
  }
  function positionalMove(free,advanced){
    var n=state.size,center=(n-1)/2,best=[],bestScore=-1e9;
    free.forEach(function(p){
      var r=Math.floor(p/n),c=p%n,score=10-Math.abs(r-center)-Math.abs(c-center);
      if((r===0||r===n-1)&&(c===0||c===n-1))score+=2;
      if(advanced){
        state.board[p]='O';score+=linePotential('O')*7;state.board[p]='X';score+=linePotential('X')*5;state.board[p]='';
      }
      if(score>bestScore){bestScore=score;best=[p]}else if(score===bestScore)best.push(p);
    });return random(best);
  }
  function linePotential(mark){
    var n=state.size,k=state.win,total=0,dirs=[[0,1],[1,0],[1,1],[1,-1]];
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)for(var d=0;d<4;d++){
      var mine=0,valid=true;
      for(var j=0;j<k;j++){var rr=r+dirs[d][0]*j,cc=c+dirs[d][1]*j;if(rr<0||rr>=n||cc<0||cc>=n){valid=false;break}var v=state.board[rr*n+cc];if(v&&v!==mark){valid=false;break}if(v===mark)mine++}
      if(valid)total+=mine*mine;
    }return total;
  }
  function minimaxBest(){
    var best=-Infinity,moves=[];
    empties(state.board).forEach(function(p){state.board[p]='O';var s=minimax(state.board,false,0,-Infinity,Infinity);state.board[p]='';if(s>best){best=s;moves=[p]}else if(s===best)moves.push(p)});return random(moves);
  }
  function minimax(board,maximizing,depth,alpha,beta){
    var res=evaluate(board,3,3);if(res)return res.winner==='O'?10-depth:res.winner==='X'?depth-10:0;
    if(maximizing){var best=-Infinity;var es=empties(board);for(var i=0;i<es.length;i++){board[es[i]]='O';best=Math.max(best,minimax(board,false,depth+1,alpha,beta));board[es[i]]='';alpha=Math.max(alpha,best);if(beta<=alpha)break}return best}
    var low=Infinity;var xs=empties(board);for(var j=0;j<xs.length;j++){board[xs[j]]='X';low=Math.min(low,minimax(board,true,depth+1,alpha,beta));board[xs[j]]='';beta=Math.min(beta,low);if(beta<=alpha)break}return low;
  }
  function setMode(mode){
    state.mode=mode;document.getElementById('friendMode').classList.toggle('active',mode==='friend');document.getElementById('botMode').classList.toggle('active',mode==='bot');document.getElementById('difficultyWrap').hidden=mode!=='bot';
    document.getElementById('oLabel').textContent=mode==='bot'?'البوت':'اللاعب O';initRound();showToast(mode==='bot'?'تم تفعيل اللعب ضد البوت':'تم تفعيل اللعب مع صديق');
  }
  document.getElementById('friendMode').onclick=function(){setMode('friend')};document.getElementById('botMode').onclick=function(){setMode('bot')};
  document.getElementById('difficultyChoices').addEventListener('click',function(e){var b=e.target.closest('[data-difficulty]');if(!b)return;state.difficulty=b.dataset.difficulty;this.querySelectorAll('.choice').forEach(function(x){x.classList.toggle('active',x===b)});initRound()});
  document.getElementById('sizeChoices').addEventListener('click',function(e){var b=e.target.closest('[data-size]');if(!b)return;state.size=+b.dataset.size;state.win=state.size===5?4:state.size;this.querySelectorAll('.choice').forEach(function(x){x.classList.toggle('active',x===b)});initRound()});
  document.getElementById('newRound').onclick=initRound;
  document.getElementById('resetScore').onclick=function(){state.scores={X:0,O:0,D:0};updateScores();showToast('تم تصفير النتيجة')};
  undoBtn.onclick=function(){
    if(!state.history.length||state.thinking)return;state.over=false;
    var count=state.mode==='bot'&&state.history.length>1?2:1;
    while(count--&&state.history.length){var last=state.history.pop();state.board[last.index]=''}
    state.turn=state.history.length%2===0?'X':'O';renderBoard();updateStatus();updateUndo();
  };
  function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(function(){toast.classList.remove('show')},1400)}
  function burst(winner){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var canvas=document.getElementById('confetti'),ctx=canvas.getContext('2d'),dpr=devicePixelRatio||1;canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.scale(dpr,dpr);
    var colors=winner==='X'?['#e4573d','#ffb199','#d99b24']:['#087d72','#55d0bd','#d99b24'];var bits=Array.from({length:70},function(){return{x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*8-3,g:.2+Math.random()*.15,s:3+Math.random()*5,c:random(colors),r:Math.random()*6}});var frame=0;
    (function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);bits.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=.14;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.65);ctx.restore()});if(frame++<110)requestAnimationFrame(draw);else ctx.clearRect(0,0,innerWidth,innerHeight)})();
  }
  initRound();updateScores();
})();
</script>
</body>
</html>

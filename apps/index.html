<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<title>تطبيقاتي</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Tahoma,sans-serif;
    background:#0a0a14; color:#fff;
    min-height:100dvh; min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    position:relative; overflow-x:hidden;
  }
  body::before {
    content:""; position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(600px 400px at 85% -5%, rgba(88,60,220,.35), transparent 60%),
      radial-gradient(500px 380px at 10% 15%, rgba(0,180,220,.22), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, rgba(220,60,160,.18), transparent 60%),
      #0a0a14;
  }
  .wrap { max-width:480px; margin:0 auto; padding:28px 20px 40px; }
  header { text-align:center; margin:26px 0 30px; }
  header h1 {
    font-size:32px; font-weight:800; letter-spacing:-.5px;
    background:linear-gradient(135deg,#fff,#a5b4fc);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p { color:rgba(255,255,255,.55); font-size:14px; margin-top:8px; }
  .grid { display:grid; gap:16px; }
  .card {
    display:flex; align-items:center; gap:16px;
    padding:18px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14);
    border-radius:22px;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    text-decoration:none; color:#fff;
    box-shadow:0 8px 32px rgba(0,0,0,.3);
    transition:transform .15s ease, background .15s ease;
  }
  .card:active { transform:scale(.97); background:rgba(255,255,255,.12); }
  .icon {
    width:58px; height:58px; border-radius:16px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 4px 14px rgba(0,0,0,.35);
  }
  .icon svg { width:30px; height:30px; }
  .i1 { background:linear-gradient(135deg,#34d399,#0ea5e9); }
  .i2 { background:linear-gradient(135deg,#fbbf24,#f97316); }
  .i3 { background:linear-gradient(135deg,#a78bfa,#6366f1); }
  .txt h2 { font-size:18px; font-weight:700; margin-bottom:4px; }
  .txt p { font-size:13px; color:rgba(255,255,255,.55); line-height:1.5; }
  .arrow { margin-inline-start:auto; color:rgba(255,255,255,.35); flex-shrink:0; }
  .arrow svg { width:22px; height:22px; display:block; }
  footer { text-align:center; margin-top:34px; color:rgba(255,255,255,.3); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>تطبيقاتي</h1>
    <p>كل تطبيقاتك في مكان واحد</p>
  </header>
  <div class="grid">
    <a class="card" href="/Salaf/">
      <div class="icon i1">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.6.8-4 4 .9 5.6-4.9-2.6L7.1 17.3l.9-5.6-4-4 5.6-.8z"/></svg>
      </div>
      <div class="txt"><h2>صفاء</h2><p>تتبع العادات والتعافي اليومي</p></div>
      <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    </a>
    <a class="card" href="/Salaf/mizani/">
      <div class="icon i2">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 14h4"/></svg>
      </div>
      <div class="txt"><h2>ميزاني</h2><p>إدارة الميزانية الشهرية والمصاريف</p></div>
      <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    </a>
    <a class="card" href="/Salaf/tawazun/">
      <div class="icon i3">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </div>
      <div class="txt"><h2>توازن</h2><p>التطبيق الشامل: ميزانية وعادات وتمارين</p></div>
      <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    </a>
  </div>
  <footer>اضغط على أي تطبيق لفتحه • محدّث</footer>
</div>
<script>
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouch < 300) e.preventDefault();
    lastTouch = now;
  }, {passive:false});
</script>
</body>
</html>
